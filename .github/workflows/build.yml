name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 cross linker
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Fetch SimConnect.dll
        run: scripts/fetch-simconnect.sh

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --target x86_64-pc-windows-gnu -- -D warnings

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-gnu

      - uses: actions/upload-artifact@v4
        with:
          name: bbs757-webcdu-windows-x64
          path: target/x86_64-pc-windows-gnu/release/bbs757-webcdu.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bbs757-webcdu-windows-x64
      - uses: softprops/action-gh-release@v2
        with:
          files: bbs757-webcdu.exe
          generate_release_notes: true
